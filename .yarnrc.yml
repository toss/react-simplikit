changesetBaseRefs:
  - HEAD

enableGlobalCache: false

enableScripts: true

nodeLinker: pnp

npmScopes:
  jsr:
    npmRegistryServer: 'https://npm.jsr.io'

supportedArchitectures:
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
  os:
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.0.cjs
