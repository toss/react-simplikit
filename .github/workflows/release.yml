name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    if: github.repository == 'toss/react-simplikit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn install

      - name: Build
        run: yarn run prepack

      - name: Type Check
        run: yarn run test:type

      # v2.1.1, not v2.1.0: v2.1.0 ignores `commit-message` due to a typo.
      # Publishing goes through `yarn npm publish` (changesets v3 + Yarn Berry), so
      # provenance is Yarn's setting; `NPM_CONFIG_PROVENANCE` would be ignored.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: yarn run changeset:version
          publish-script: yarn run changeset:publish
        env:
          YARN_NPM_PUBLISH_PROVENANCE: true

      - name: Summarize published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          {
            echo "## Published to npm"
            echo
            echo "$PUBLISHED_PACKAGES" | jq -r '.[] | "- [\(.name)@\(.version)](https://www.npmjs.com/package/\(.name)/v/\(.version))"'
          } >> "$GITHUB_STEP_SUMMARY"

  get-diffs:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.diffs.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files from merged PR
        id: diffs
        run: |
          MATCHED_NAMES=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^packages/[^/]+/src/[^/]+/([^/]+)/\1\.tsx?$' | sed -r "s/.+\/(.+)\..+/\1/" | tr "\n" "," | sed 's/,$//')

          echo $MATCHED_NAMES

          echo "result=$MATCHED_NAMES" >> "$GITHUB_OUTPUT"

  generate-docs:
    runs-on: ubuntu-latest
    needs: get-diffs
    if: ${{ needs.get-diffs.outputs.result != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Generate docs
        run: |
          yarn run docs:gen ${{ needs.get-diffs.outputs.result }}
          yarn run fix:format
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: new-docgen-branch-${{ github.run_id }}
          title: 'docs(${{ needs.get-diffs.outputs.result }}): auto-generated docs'
          body: 'This PR includes documentation updates for: ${{ needs.get-diffs.outputs.result }}'
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          reviewers: mnxmnz,hyesungoh
          commit-message: 'Generate docs for ${{ needs.get-diffs.outputs.result }}'
